name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Run lint, tests, and build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

      - name: Report missing frontend
        if: hashFiles('frontend/package.json') == ''
        run: echo "::notice::No frontend/package.json was found; frontend checks will run when the frontend is added."
