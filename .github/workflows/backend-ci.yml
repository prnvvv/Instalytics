name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests

      - name: Run tests
        run: |
          if grep -R -q -E '^[[:space:]]*(def test_|class Test)' backend/tests; then
            python -m pytest -q backend/tests
          else
            echo "::notice::No pytest test cases were found under backend/tests."
          fi

  docker:
    name: Backend image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag instalytics-api:ci backend

      - name: Smoke-test container
        run: |
          docker run -d --name api -p 8080:10000 -e PORT=10000 -e APP_ENV=production instalytics-api:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/v1/health/live && exit 0
            sleep 1
          done
          docker logs api
          exit 1
