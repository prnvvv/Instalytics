name: Data Validation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-validation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-data:
    name: Validate data files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate CSV, JSON, and JSON Lines files
        run: python .github/scripts/validate_data.py .

      - name: Test data validator
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
